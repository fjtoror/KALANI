apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dbot-dev

bases:
  - ../../base

resources:
  - namespace.yaml
  - secret.yaml

replicas:
  - name: discord-bot
    count: 1

images:
  - name: mybot
    newName: quay.io/gfontana/dbot
    newTag: dev

commonLabels:
  environment: dev
