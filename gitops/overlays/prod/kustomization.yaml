apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dbot-prod

bases:
  - ../../base

resources:
  - namespace.yaml
  - secret-sealed.yaml

replicas:
  - name: discord-bot
    count: 1

images:
  - name: mybot
    newName: quay.io/gfontana/dbot
    newTag: latest

commonLabels:
  environment: prod

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: discord-bot
      spec:
        template:
          spec:
            containers:
            - name: bot
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "200m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
